<section id="contact" class="mx-auto flex max-w-7xl flex-wrap gap-10 px-4 py-16 md:gap-16 md:px-8 md:py-28">
  <div class="flex flex-[1_1_320px] flex-col gap-4">
    <span class="eyebrow text-accent dark:text-[#8ea2ff]">{{ resource.home.contact_eyebrow }}</span>
    <h2 class="m-0 font-display text-[32px] leading-[1.04] font-extrabold tracking-[-0.03em] md:text-5xl">
      {{ resource.home.contact_title }}
    </h2>
    <p class="m-0 max-w-sm text-base leading-relaxed text-[#4a4a52] dark:text-zinc-300">{{ resource.home.contact_text }}</p>
  </div>

  <form
    [formGroup]="contactForm"
    (ngSubmit)="onSubmitForm()"
    novalidate
    class="grid min-w-0 flex-[2_1_560px] grid-cols-1 gap-4 md:grid-cols-2"
  >
    <label class="flex flex-col gap-2 text-sm font-semibold">
      {{ resource.home.label_name }}
      <input
        type="text"
        formControlName="name"
        autocomplete="name"
        [placeholder]="resource.contact.name_placeholder"
        class="field font-normal"
        [class.is-invalid]="shouldShowNameError()"
      />
      @if (shouldShowNameError()) {
        <span class="text-[13px] font-normal text-red-600 dark:text-red-400">{{ resource.error.surname_mandatory }}</span>
      }
    </label>

    <label class="flex flex-col gap-2 text-sm font-semibold">
      {{ resource.home.label_email }}
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        [placeholder]="resource.contact.email_placeholder"
        class="field font-normal"
        [class.is-invalid]="shouldShowMailError()"
      />
      @if (shouldShowMailError()) {
        <span class="text-[13px] font-normal text-red-600 dark:text-red-400">
          {{ f.email.errors?.['email'] ? resource.error.email_invalid : resource.error.email_mandatory }}
        </span>
      }
    </label>

    <label class="flex flex-col gap-2 text-sm font-semibold md:col-span-2">
      {{ resource.home.label_subject }}
      <input
        type="text"
        formControlName="subject"
        [placeholder]="resource.contact.subject_placeholder"
        class="field font-normal"
        [class.is-invalid]="shouldShowSubjectError()"
      />
      @if (shouldShowSubjectError()) {
        <span class="text-[13px] font-normal text-red-600 dark:text-red-400">{{ resource.error.subject_mandatory }}</span>
      }
    </label>

    <label class="flex flex-col gap-2 text-sm font-semibold md:col-span-2">
      {{ resource.home.label_message }}
      <textarea
        formControlName="message"
        rows="5"
        [placeholder]="resource.contact.message_placeholder"
        class="field font-normal"
        [class.is-invalid]="shouldShowMessageError()"
      ></textarea>
      @if (shouldShowMessageError()) {
        <span class="text-[13px] font-normal text-red-600 dark:text-red-400">{{ resource.error.message_mandatory }}</span>
      }
    </label>

    <div class="flex justify-end md:col-span-2">
      <button
        type="submit"
        [disabled]="loading"
        class="inline-flex h-[52px] w-full cursor-pointer items-center justify-center gap-2 rounded-full border-0 bg-accent px-8 text-base font-semibold text-white transition-colors hover:bg-accent-hover disabled:cursor-wait disabled:opacity-70 md:w-auto"
      >
        @if (loading) {
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
          {{ resource.contact.loading }}
        } @else {
          {{ resource.contact.send_message }}
        }
      </button>
    </div>
  </form>
</section>
